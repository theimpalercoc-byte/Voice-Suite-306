name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile Portable Windows App
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --name "VoiceSuite306" `
          --add-data "avatars;avatars" `
          --add-data "weights;weights" `
          --add-data "voices;voices" `
          studio_app.py

    - name: Generate Code Signing Certificate & Sign Binary
      shell: powershell
      run: |
        # 1. Create a self-signed Code Signing Certificate
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=VoiceSuite306, O=theimpalercoc-byte" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
        
        # 2. Export public certificate
        Export-Certificate -Cert $cert -FilePath "dist\VoiceSuite306\VoiceSuite306.cer"

        # 3. Locate SignTool from Windows SDK
        $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1).FullName
        if ($signtool) {
            Write-Host "Signing binary with: $signtool"
            & $signtool sign /fd SHA256 /a /s "My" "dist\VoiceSuite306\VoiceSuite306.exe"
        }

        # 4. Create 1-click Windows Trust script to bypass SmartScreen
        $trustScript = @"
        @echo off
        echo =========================================================
        echo Authorizing VoiceSuite306 on this PC...
        echo =========================================================
        certutil -addstore -f "Root" "%~dp0VoiceSuite306.cer"
        certutil -addstore -f "TrustedPublisher" "%~dp0VoiceSuite306.cer"
        echo.
        echo Authorization complete! Windows SmartScreen warnings cleared.
        pause
        "@
        Set-Content -Path "dist\VoiceSuite306\Trust_Certificate_RunAsAdmin.bat" -Value $trustScript

    - name: Package Release Archive
      shell: powershell
      run: |
        Compress-Archive -Path "dist\VoiceSuite306\*" -DestinationPath "VoiceSuite306-Windows-x64.zip"
        $hash = (Get-FileHash -Path "VoiceSuite306-Windows-x64.zip" -Algorithm SHA256).Hash
        Set-Content -Path "SHA256SUMS.txt" -Value "$hash  VoiceSuite306-Windows-x64.zip"

    - name: Publish Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceSuite306-Windows-x64
        path: |
          VoiceSuite306-Windows-x64.zip
          SHA256SUMS.txt
